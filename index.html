<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Eletrônica Cajobi</title>
<style>
:root{--bg:#f5f7fb;--ink:#132238;--mut:#607086;--line:#dce4ee;--card:#fff;--brand:#0b57b8;--brand-2:#08458f;--accent:#7a0020;--danger:#b42318;--soft:#e8f0fb;--shadow:0 14px 38px rgba(20,45,70,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}body:before{content:"";display:block;height:4px;background:linear-gradient(90deg,#0a9bf0,var(--brand),var(--accent))}
header{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:18px max(22px,calc((100% - 1180px)/2));display:flex;align-items:center;gap:18px;flex-wrap:wrap;box-shadow:0 6px 22px rgba(16,42,67,.07)}header b{font-size:18px;letter-spacing:-.2px}header .sp{flex:1}header a{transition:opacity .2s}header a:hover{opacity:.8}
.brand{display:flex;align-items:center;gap:11px}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#2dd4bf,#0f766e);font-size:19px;box-shadow:0 6px 14px rgba(11,87,184,.3)}.brand-copy{display:flex;flex-direction:column}.brand .logo{height:62px;width:auto;display:block}.brand-copy{border-left:1px solid var(--line);padding-left:12px}.brand-copy small{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:1.5px;font-weight:700}
nav{display:flex;gap:5px;align-items:center}nav button{background:transparent;border:0;color:#4b5d73;padding:9px 13px;border-radius:9px;font:inherit;cursor:pointer;transition:.2s}nav button:hover{background:#eef3f9;color:var(--ink)}nav button.on{background:var(--brand);color:#fff}
main{max-width:1180px;margin:0 auto;padding:30px 20px 72px}.card{background:var(--card);border:1px solid rgba(220,228,238,.9);border-radius:16px;padding:24px;margin-bottom:18px;box-shadow:var(--shadow)}h2{margin:0 0 17px;font-size:20px;letter-spacing:-.3px}h3{margin:22px 0 9px;font-size:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 6px;font-weight:700;letter-spacing:.15px}input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink);transition:border .2s,box-shadow .2s}input:focus,select:focus,textarea:focus,button:focus-visible{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,87,184,.14)}textarea{min-height:88px;resize:vertical}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:750;cursor:pointer;transition:transform .18s,background .18s,box-shadow .18s;box-shadow:0 5px 12px rgba(11,87,184,.18)}.btn:hover{background:var(--brand-2);transform:translateY(-1px)}.btn:disabled{opacity:.6;cursor:wait;transform:none}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.btn.sec:hover{background:#f5f8fb}.btn.wa{background:#178b4a}.hint{font-size:13px;color:var(--mut);margin-top:5px}.found{color:var(--brand);font-weight:700}.proto{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#b45309;font-weight:800;letter-spacing:.2px}.chip{display:inline-block;padding:5px 11px;border-radius:99px;font-size:12px;font-weight:750;background:#e9eef3;color:var(--ink);white-space:nowrap}.s0{background:#dbeafe;color:#1d4f8a}.s1{background:#ede9fe;color:#5b21b6}.s2{background:#fef3c7;color:#92400e}.s3,.s4{background:#d1fae5;color:#047857}.s6{background:#bbf7d0;color:#166534}.s8,.s9{background:#fee2e2;color:#991b1b}.s10{background:#e9eef3;color:#475569}
.row{display:grid;grid-template-columns:155px 1fr auto;gap:15px;align-items:center;padding:15px 9px;border-bottom:1px solid #edf1f5;cursor:pointer;border-radius:10px;transition:background .2s}.row:hover{background:#f6faf9}.row small{color:var(--mut)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.filters button{border:1px solid var(--line);background:#fff;color:var(--mut);border-radius:99px;padding:6px 12px;font:inherit;font-size:12px;cursor:pointer}.filters button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.mask{position:fixed;inset:0;background:rgba(16,42,67,.58);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:28px 14px;z-index:10}.modal{background:#fff;border-radius:18px;width:100%;max-width:700px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.2)}.photos{display:flex;gap:9px;flex-wrap:wrap;margin-top:8px}.photos div{position:relative}.photos img{width:88px;height:88px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}.photos button{position:absolute;top:-7px;right:-7px;border:0;background:var(--danger);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;line-height:1}
.steps{display:flex;margin:24px 0 8px}.step{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative}.step i{display:block;width:18px;height:18px;border-radius:50%;background:#d8e1ea;margin:0 auto 7px;position:relative;z-index:1;border:4px solid #fff;box-shadow:0 0 0 1px #d8e1ea}.step:not(:first-child):before{content:"";position:absolute;top:8px;left:-50%;width:100%;height:2px;background:#d8e1ea}.step.ok i{background:var(--brand);box-shadow:0 0 0 1px var(--brand)}.step.ok:before{background:var(--brand)}.step.ok{color:var(--ink);font-weight:750}.tl{border-left:2px solid #dbe5ed;margin:14px 0 0 7px;padding-left:18px}.tl div{margin-bottom:15px;position:relative}.tl div:before{content:"";position:absolute;left:-24px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 4px var(--soft)}.tl small{color:var(--mut)}.big{font-size:24px;font-weight:800;letter-spacing:-.6px;margin:5px 0 9px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#102a43;color:#fff;padding:12px 18px;border-radius:10px;z-index:20;max-width:92%;box-shadow:0 10px 25px rgba(16,42,67,.25)}.toast.err{background:var(--danger)}.login{max-width:390px;margin:12vh auto;text-align:center}.logo-login{display:block;height:92px;width:auto;margin:0 auto 14px}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;align-items:stretch;margin-bottom:18px}.hero-copy{background:linear-gradient(135deg,#102a43,#164e63);color:#fff;border-radius:18px;padding:30px;box-shadow:var(--shadow)}.hero-copy h1{font-size:clamp(27px,4vw,42px);line-height:1.08;margin:7px 0 12px;letter-spacing:-1.2px}.hero-copy p{color:#c5d7e4;max-width:510px;margin:0}.hero-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:#a7f3d0;font-weight:800;text-transform:uppercase;letter-spacing:1.1px}.hero-side{background:linear-gradient(145deg,#e8f0fb,#fff);border:1px solid #cfe0f7;border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center}.hero-side strong{font-size:16px}.hero-side p{margin:8px 0 0;color:var(--mut);font-size:14px}.section-kicker{font-size:12px;color:var(--brand);font-weight:800;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
#print{display:none}@media print{@page{size:A5 portrait;margin:10mm}body:before{display:none}body>*:not(#print){display:none!important}#print{display:block!important;background:#fff;width:100%}#print .rc{-webkit-print-color-adjust:exact;print-color-adjust:exact;font:10.5pt/1.35 Arial,sans-serif;color:#000;width:100%;max-width:none;margin:0;padding:0}#print h1{margin:0;font-size:12pt}#print .hd{display:flex;align-items:center;gap:10px;border-bottom:2px solid #000;padding-bottom:6px}#print .hd img{height:17mm;width:auto}#print h2{font-size:13pt;margin:8px 0 0}#print table{width:100%;border-collapse:collapse;margin:8px 0;font-size:9.5pt}#print td{border:1px solid #888;padding:5px 6px;vertical-align:top}#print td:first-child{width:28%;background:#eee;font-weight:bold}#print .pt{font:bold 21pt monospace;border:2px solid #000;padding:6px;text-align:center;margin:8px 0}#print .sg{display:flex;gap:24px;margin-top:32px}#print .sg div{flex:1;border-top:1px solid #000;text-align:center;padding-top:4px}}
@media(max-width:720px){header{padding:12px 16px}.brand .logo{height:50px}nav{width:100%;overflow:auto}nav button{flex:1;white-space:nowrap}.hero{grid-template-columns:1fr}.hero-side{min-height:150px}main{padding:22px 13px 55px}.card{padding:19px;border-radius:14px}.row{grid-template-columns:1fr auto;gap:7px}.row .proto{grid-column:1/-1}}
@media(max-width:430px){.steps{margin-left:-5px;margin-right:-5px}.step{font-size:10px}.big{font-size:21px}.hero-copy{padding:23px}}
.ph h1{margin:0 0 16px;font-size:26px;letter-spacing:-.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}.kpi b{display:block;font-size:25px;letter-spacing:-.6px;line-height:1.2}.kpi span{font-size:12px;color:var(--mut);font-weight:700}
.kpi.warn{border-color:#f3d28b;background:#fffaf0}.kpi.ok b{color:#047857}.kpi.bad b{color:var(--danger)}
.alert{display:flex;gap:10px;align-items:center;padding:11px 14px;border-radius:10px;background:#fff7e6;border:1px solid #f3d28b;margin-bottom:8px;cursor:pointer}.alert.red{background:#fdecec;border-color:#f3bcbc}.alert:hover{filter:brightness(.97)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:#eef3f9;color:#33475b;font-weight:700;margin:3px 4px 0 0}.tag.late{background:#fee2e2;color:#991b1b}.tag.pend{background:#fef3c7;color:#92400e}.tag.ok{background:#d1fae5;color:#047857}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}.t th{text-align:left;font-size:11.5px;color:var(--mut);padding:8px;border-bottom:2px solid var(--line);white-space:nowrap}.t td{padding:10px 8px;border-bottom:1px solid #edf1f5;vertical-align:top}.t td.r,.t th.r{text-align:right;white-space:nowrap}.tw{overflow:auto}
.btn.sm{padding:7px 12px;font-size:13px}.userchip{font-size:13px;color:var(--mut);font-weight:700}
.sec-t{margin:20px 0 8px;font-size:12px;letter-spacing:1.2px;text-transform:uppercase;color:var(--mut);font-weight:800}
.fin-box{background:#f6f9fd;border:1px solid #d8e4f4;border-radius:12px;padding:14px;margin-top:6px}
.mini{font-size:8.5pt}
</style></head>

(function () { const l = document.createElement('link'); l.rel = 'icon'; l.href = LOGO; document.head.appendChild(l); })();
const CONFIG = window.APP_CONFIG || { API_URL: '' };
const QS = new URLSearchParams(location.search);
const BOOT = { modo: QS.has('admin') ? 'admin' : 'cliente', p: String(QS.get('p') || '').replace(/[^A-Za-z0-9-]/g, '').toUpperCase(), fluxo: ['Recebido para orçamento','Em análise técnica','Aguardando aprovação do orçamento','Orçamento aprovado','Aguardando peça','Em conserto','Pronto para retirada','Orçamento recusado','Sem conserto','Entregue ao cliente','Cancelado'] };
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api = async (fn, ...args) => {
  if (!CONFIG.API_URL || CONFIG.API_URL.includes('__')) throw new Error('Configure a URL do Apps Script em config.js.');
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(CONFIG.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn, args }), signal: ctrl.signal });
    if (!r.ok) throw new Error('Servidor respondeu com erro HTTP ' + r.status + '.');
    const d = await r.json(); if (d && d.error) throw new Error(d.error); return d;
  } catch (e) { if (e.name === 'AbortError') throw new Error('A operação demorou mais de 30 segundos. Verifique a conexão e tente novamente.'); throw e; }
  finally { clearTimeout(timer); }
};
function toast(m, err) { const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 3800); }
const stepIdx = {'Recebido para orçamento':0,'Em análise técnica':1,'Aguardando aprovação do orçamento':2,'Orçamento aprovado':3,'Aguardando peça':3,'Em conserto':3,'Pronto para retirada':4,'Orçamento recusado':4,'Sem conserto':4,'Entregue ao cliente':5,'Cancelado':5};
const cls = s => 's' + BOOT.fluxo.indexOf(s);
const chip = s => `<span class="chip ${cls(s)}">${esc(s)}</span>`;

/* ================= CLIENTE ================= */
function viewCliente() {
  app.innerHTML = `<header><div class="brand"><img class="logo" src="${LOGO}" alt="Eletrônica Cajobi – Assistência técnica"></div><span class="sp"></span><a href="?admin=1" style="color:var(--brand);text-decoration:none;font-size:13px;font-weight:700">Acesso ao balcão →</a></header><main>
  <section class="hero"><div class="hero-copy"><div class="hero-badge">● Acompanhamento online</div><h1>Saiba em que etapa está o seu equipamento.</h1><p>Consulte o protocolo do seu comprovante e acompanhe o serviço com transparência, do recebimento à retirada.</p></div><div class="hero-side"><strong>Como consultar?</strong><p>Digite o código no formato <span class="proto">OF-2026-0001</span>. Se houver orçamento pendente, você poderá responder por aqui.</p></div></section><div class="card"><div class="section-kicker">Consulta rápida</div><h2>Digite o protocolo do comprovante</h2>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><input id="cp" placeholder="OF-2026-0001" value="${esc(BOOT.p)}" style="font-family:ui-monospace,monospace;text-transform:uppercase">
  <button class="btn" id="cb">Consultar protocolo</button></div></div><div id="cr"></div></main>`;
  $('#cb').onclick = consultar; $('#cp').onkeydown = e => e.key === 'Enter' && consultar();
  if (BOOT.p) consultar();
}
async function consultar() {
  const p = $('#cp').value.trim(); if (!p) return;
  $('#cr').innerHTML = '<div class="card">Buscando…</div>';
  try { renderCliente(await api('pub_consultar', p)); } catch (e) { $('#cr').innerHTML = `<div class="card" style="color:var(--err)">${esc(e.message)}</div>`; }
}
function renderCliente(r) {
  if (r.logo) { const lg = document.querySelector('.brand .logo'); if (lg) lg.src = r.logo; }
  const at = stepIdx[r.status], L = ['Recebido','Análise','Orçamento','Conserto','Retirada','Entregue'];
  $('#cr').innerHTML = `<div class="card"><div class="proto">${esc(r.protocolo)}</div><div class="big">${esc(r.equip)}</div>
  ${chip(r.status)} <span class="hint">Entrada em ${esc(r.entrada)} · ${esc(r.empresa)}</span>
  <div class="steps">${L.map((l, i) => `<div class="step ${i <= at ? 'ok' : ''}"><i></i>${l}</div>`).join('')}</div>
  ${r.valor ? `<p><b>Orçamento:</b> ${esc(r.valor)}${r.prazo ? ' · Prazo: ' + esc(r.prazo) : ''}</p>` : ''}
  ${r.sitPag ? `<p><b>Pagamento:</b> ${esc(r.sitPag)}${r.formas ? ' · Formas aceitas: ' + esc(r.formas) : ''}${r.pix && r.sitPag !== 'Pago' ? '<br>Chave Pix: <b>' + esc(r.pix) + '</b>' : ''}</p>` : ''}
  ${r.garantiaAte ? `<p><b>Garantia até:</b> ${esc(r.garantiaAte)}</p>` : ''}
  ${r.podeResponder ? `<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="responder(true)">Aprovar orçamento</button><button class="btn sec" onclick="responder(false)">Recusar orçamento</button></div>` : ''}

  <div class="sec-t">Atualizar serviço</div><div class="grid">
  <div class="full"><label>Nova etapa</label><select id="us">${BOOT.fluxo.map(s => `<option ${s === e.Status ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select></div>
  ${F('uv', 'Valor do orçamento / total cobrado (R$)', e.Valor, 'inputmode="decimal"')}${F('up', 'Prazo (texto)', e.Prazo, 'placeholder="Ex.: 5 dias úteis"')}
  <div><label>Previsão de entrega</label><input type="date" id="ud" value="${esc(e.Previsao)}"></div>${F('ug', 'Garantia (dias)', e.GarantiaDias, 'inputmode="numeric"')}
  <div class="full"><label>Diagnóstico / laudo técnico (interno)</label><textarea id="ul">${esc(e.Laudo)}</textarea></div>
  <div class="full"><label>Serviço realizado</label><input id="us2" value="${esc(e.Servico)}"></div>
  <div class="full"><label>Observação (aparece para o cliente)</label><input id="uo"></div>
  ${D ? `<div class="full fin-box"><b>🔒 Área do proprietário</b><div class="grid" style="margin-top:10px"><div><label>Técnico responsável</label><select id="ut"><option value="">— sem técnico —</option>${d.usuarios.map(u => `<option value="${esc(u.ID)}" data-c="${esc(u.Comissao)}" ${u.ID === e.TecnicoID ? 'selected' : ''}>${esc(u.Nome)}</option>`).join('')}</select></div>
  ${F('uc', 'Comissão do técnico (%)', e.ComissaoPct, 'inputmode="decimal"')}${F('um', 'Custo do material (R$)', e.CustoMaterial, 'inputmode="decimal"')}${F('uk', 'Valor da mão de obra (R$)', e.MaoDeObra, 'inputmode="decimal"')}</div>
  <p class="hint" style="margin:10px 0 0">Comissão calculada: <b>${brl(com)}</b> · Recebido ${brl(rec)} − material ${brl(e.CustoMaterial)} − comissão ${brl(com)} = <b>resultado ${brl(res)}</b></p></div>` : ''}
  <div class="full"><label><input type="checkbox" id="un" checked style="width:auto"> Avisar o cliente pelo WhatsApp</label></div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn" id="ug2">Salvar</button><button class="btn sec" id="ur">Reenviar última mensagem</button></div>
  ${D ? `<div class="sec-t">Pagamentos</div><div class="fin-box"><div class="hint" style="margin:0 0 8px">Cobrado <b>${brl(tot)}</b> · Recebido <b>${brl(rec)}</b> · Pendente <b>${brl(saldo)}</b> · ${esc(e.SitPag || 'sem valor definido')}</div>
  ${pags.map(g => `<div class="hint" style="margin:2px 0">${esc(g.Data)} · ${esc(g.Forma)} · <b>${brl(g.Valor)}</b>${g.Obs ? ' · ' + esc(g.Obs) : ''} <button class="btn sec sm" data-rec="${esc(g.ID)}">Recibo</button></div>`).join('')}
  ${saldo > 0 ? `<div class="grid" style="margin-top:10px"><div><label>Forma</label><select id="pf">${String(CFG.FORMAS_PAG || '').split(',').map(s => s.trim()).filter(Boolean).map(s => `<option>${esc(s)}</option>`).join('')}</select></div>${F('pv', 'Valor recebido (R$)', saldo.toFixed(2), 'inputmode="decimal"')}${F('po', 'Observação', '')}</div><p><button class="btn sm" id="pb">Registrar pagamento</button></p>` : ''}</div>` : ''}
  <div class="sec-t">Histórico</div><div class="tl">${d.h.map(h => `<div><b>${esc(h.Status)}</b> <small>${esc(h.Data)} · ${esc(h.Usuario)} · WhatsApp: ${esc(h.WhatsApp)}</small>${h.Observacao ? '<br>' + esc(h.Observacao) : ''}</div>`).join('')}</div></div>`;
  document.body.appendChild(m); const find = s => m.querySelector(s); find('#x').onclick = () => m.remove(); m.addEventListener('click', ev => { if (ev.target === m) m.remove(); });
  m.querySelectorAll('[data-doc]').forEach(b => b.onclick = () => printDoc(b.dataset.doc, e, { link: d.link, fotosQtd: e.Fotos ? e.Fotos.split('\n').length : 0, dataAprov: aprov }));
  m.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => printDoc('recibo', e, { pg: pags.find(g => g.ID === b.dataset.rec) }));
  if (find('#ut')) find('#ut').onchange = () => { const o = find('#ut').selectedOptions[0]; if (o.dataset.c !== undefined && !find('#uc').value) find('#uc').value = o.dataset.c; };
  const manualWa = w => { if (!w || !w.link || w.resultado === 'ENVIADO') return; const wa = document.createElement('div'); wa.className = 'mask'; wa.innerHTML = `<div class="modal" style="text-align:center"><div class="section-kicker">Salvo</div><h2>Mensagem pronta para o cliente</h2><p class="hint">O envio está como <b>${esc(w.resultado)}</b>. Abra o WhatsApp com a mensagem preenchida.</p><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-top:18px"><a class="btn wa" href="${esc(w.link)}" target="_blank" rel="noopener">Abrir WhatsApp Web</a><button class="btn sec" id="cw" type="button">Fechar</button></div></div>`; document.body.appendChild(wa); wa.querySelector('#cw').onclick = () => wa.remove(); };
  find('#ug2').onclick = async () => {
    const st = find('#us').value; if (['Cancelado', 'Entregue ao cliente'].includes(st) && !confirm('Confirmar a etapa "' + st + '"?')) return;
    const b = find('#ug2'); b.disabled = true; b.textContent = 'Salvando…';
    const o = { protocolo: p, status: st, valor: find('#uv').value, prazo: find('#up').value, previsao: find('#ud').value, garantiaDias: find('#ug').value, laudo: find('#ul').value, servico: find('#us2').value, obs: find('#uo').value, notificar: find('#un').checked };
    if (D) Object.assign(o, { tecnicoId: find('#ut').value, comissaoPct: find('#uc').value, custo: find('#um').value, maoObra: find('#uk').value });
    try { const w = await api('api_atualizar', PIN, o); toast('Serviço atualizado.'); m.remove(); viewPainel(); manualWa(w); } catch (er) { b.disabled = false; b.textContent = 'Salvar'; toast(er.message, true); }
  };
  find('#ur').onclick = async () => { const b = find('#ur'); b.disabled = true; try { manualWa(await api('api_reenviar', PIN, p)); } catch (er) { toast(er.message, true); } b.disabled = false; };
  if (find('#pb')) find('#pb').onclick = async () => {
    const v = find('#pv').value; if (!confirm('Registrar pagamento de ' + brl(String(v).replace(',', '.')) + ' em ' + find('#pf').value + '?')) return;
    try { await api('api_pagamento', PIN, { protocolo: p, forma: find('#pf').value, valor: v, obs: find('#po').value }); toast('Pagamento registrado.'); m.remove(); abrir(p); } catch (er) { toast(er.message, true); }
  };
}
/* ---- Financeiro ---- */
async function viewFin() {
  $('#m').innerHTML = `<div class="ph"><h1>Financeiro</h1></div><div class="card" style="padding-bottom:6px">${perHTML()}</div><div id="fr"><div class="card">Carregando…</div></div>`; perBind(viewFin);
  try {
    const r = await api('api_financeiro', PIN, { de: PER.de, ate: PER.ate }), t = r.totais, k = (n, l, c) => `<div class="kpi ${c || ''}"><b>${n}</b><span>${l}</span></div>`;
    $('#fr').innerHTML = `<div class="kpis">${k(brl(t.cobrado), 'Valor cobrado')}${k(brl(t.recebido), 'Valor recebido', 'ok')}${k(brl(t.pendente), 'Pendente de recebimento', Number(t.pendente) > 0 ? 'warn' : '')}${k(brl(t.material), 'Custo de materiais')}${k(brl(t.comissao), 'Comissões')}${k(brl(t.resultado), 'Resultado', Number(t.resultado) < 0 ? 'bad' : 'ok')}</div>
    <div class="card tw"><table class="t"><tr><th>Protocolo</th><th>Cliente / equipamento</th><th class="r">Cobrado</th><th class="r">Recebido</th><th class="r">Pendente</th><th class="r">Material</th><th class="r">Comissão</th><th class="r">Resultado</th></tr>
    ${r.linhas.map(l => { const rs = Number(l.Recebido) - Number(l.CustoMaterial) - Number(l.ComissaoValor); return `<tr><td class="proto">${esc(l.Protocolo)}</td><td>${esc(l.Cliente)}<br><small>${esc(l.Equip)}${l.Tecnico ? ' · ' + esc(l.Tecnico) : ''}</small></td><td class="r">${brl(l.Valor)}</td><td class="r">${brl(l.Recebido)}</td><td class="r">${brl(Number(l.Valor) - Number(l.Recebido))}</td><td class="r">${brl(l.CustoMaterial)}</td><td class="r">${brl(l.ComissaoValor)}</td><td class="r"><b style="color:${rs < 0 ? 'var(--danger)' : '#047857'}">${brl(rs)}</b></td></tr>`; }).join('') || '<tr><td colspan="8" class="hint">Nenhum serviço aprovado no período.</td></tr>'}</table></div>
    <p class="hint">Considera serviços aprovados em diante, com entrada no período. Todos os registros também ficam na planilha.</p>`;

/* ---- Comissões ---- */
let CU = '';
async function viewCom() {
  const D = dono(); let us = [];
  if (D) try { us = await api('api_usuarios', PIN); } catch (e) { }
  $('#m').innerHTML = `<div class="ph"><h1>${D ? 'Comissões' : 'Minhas comissões'}</h1></div><div class="card" style="padding-bottom:6px">${perHTML()}${D ? `<div style="max-width:260px;margin-bottom:12px"><label>Técnico</label><select id="cu"><option value="">Todos</option>${us.filter(u => u.Perfil !== 'PROPRIETARIO' || u.Comissao > 0).map(u => `<option value="${esc(u.ID)}" ${u.ID === CU ? 'selected' : ''}>${esc(u.Nome)}</option>`).join('')}</select></div>` : ''}</div><div id="cr2"><div class="card">Carregando…</div></div>`;
  perBind(viewCom); if ($('#cu')) $('#cu').onchange = () => { CU = $('#cu').value; viewCom(); };
  try {
    const r = await api('api_comissoes', PIN, { de: PER.de, ate: PER.ate, usuarioId: CU }), k = (n, l, c) => `<div class="kpi ${c || ''}"><b>${n}</b><span>${l}</span></div>`;
    $('#cr2').innerHTML = `<div class="kpis">${k(brl(r.pendente), 'Comissões pendentes', Number(r.pendente) > 0 ? 'warn' : '')}${k(brl(r.paga), 'Comissões pagas', 'ok')}</div>
    ${D && r.porTecnico.length ? `<div class="card tw"><table class="t"><tr><th>Técnico</th><th class="r">Pendente</th><th class="r">Pago</th></tr>${r.porTecnico.map(x => `<tr><td>${esc(x.nome)}</td><td class="r">${brl(x.pendente)}</td><td class="r">${brl(x.paga)}</td></tr>`).join('')}</table></div>` : ''}
    <div class="card tw"><table class="t"><tr>${D ? '<th></th>' : ''}<th>Protocolo</th><th>Técnico</th><th class="r">Mão de obra</th><th class="r">%</th><th class="r">Comissão</th><th>Situação</th><th>Gerada</th><th>Paga em</th></tr>
    ${r.rows.map(c => `<tr>${D ? `<td>${c.Status === 'Pendente' ? `<input type="checkbox" class="ck" value="${esc(c.ID)}" style="width:auto">` : ''}</td>` : ''}<td class="proto">${esc(c.Protocolo)}</td><td>${esc(c.Tecnico)}</td><td class="r">${brl(c.Base)}</td><td class="r">${esc(c.Pct)}%</td><td class="r"><b>${brl(c.Valor)}</b></td><td><span class="tag ${c.Status === 'Paga' ? 'ok' : 'pend'}">${esc(c.Status)}</span></td><td>${esc(c.Gerada)}</td><td>${esc(c.Paga)}${c.PagaPor ? ' · ' + esc(c.PagaPor) : ''}</td></tr>`).join('') || `<tr><td colspan="9" class="hint">Nenhuma comissão no período.</td></tr>`}</table></div>
    ${D && r.rows.some(c => c.Status === 'Pendente') ? '<button class="btn" id="pc">Marcar selecionadas como pagas</button>' : ''}
    <p class="hint">Comissão = percentual do técnico sobre o valor da mão de obra. ${CFG.REGRA_COMISSAO === 'PAGAMENTO' ? 'Gerada somente após o pagamento total do serviço.' : 'Gerada quando o serviço fica pronto para retirada.'}</p>`;
    if ($('#pc')) $('#pc').onclick = async () => { const ids = [...document.querySelectorAll('.ck:checked')].map(x => x.value); if (!ids.length) return toast('Marque ao menos uma comissão.', true); if (!confirm('Marcar ' + ids.length + ' comissão(ões) como paga(s)? Depois de paga, ela não muda mais.')) return; try { await api('api_pagarComissao', PIN, ids); toast('Pagamento registrado.'); viewCom(); } catch (e) { toast(e.message, true); } };
  } catch (e) { $('#cr2').innerHTML = `<div class="card" style="color:var(--danger)">${esc(e.message)}</div>`; }
}
/* ---- Funcionários ---- */
async function viewFunc() {
  $('#m').innerHTML = '<div class="card">Carregando…</div>';
  try {
    const us = await api('api_usuarios', PIN);
    $('#m').innerHTML = `<div class="ph" style="display:flex;justify-content:space-between;align-items:center"><h1>Funcionários</h1><button class="btn" id="nf">+ Novo funcionário</button></div><div class="card tw"><table class="t"><tr><th>Nome</th><th>Perfil</th><th class="r">Comissão</th><th>Situação</th><th></th></tr>
    ${us.map(u => `<tr><td><b>${esc(u.Nome)}</b></td><td>${u.Perfil === 'PROPRIETARIO' ? 'Proprietário' : 'Funcionário'}</td><td class="r">${esc(u.Comissao)}%</td><td><span class="tag ${u.Ativo === 'SIM' ? 'ok' : 'late'}">${u.Ativo === 'SIM' ? 'Ativo' : 'Inativo'}</span></td><td style="white-space:nowrap"><button class="btn sec sm" data-e="${esc(u.ID)}">Editar</button> <button class="btn sec sm" data-s="${esc(u.Nome)}">Serviços</button></td></tr>`).join('')}</table></div>
    <p class="hint">Cada pessoa entra com o próprio PIN (4 a 8 números). O funcionário só vê os serviços atribuídos a ele ou ainda sem técnico, e nunca vê custos, lucros ou comissões dos outros.</p>`;
    const form = u => { const m = document.createElement('div'); m.className = 'mask'; u = u || { Perfil: 'FUNCIONARIO', Comissao: '0', Ativo: 'SIM' };
      m.innerHTML = `<div class="modal"><h2>${u.ID ? 'Editar' : 'Novo'} funcionário</h2><div class="grid"><div><label>Nome</label><input id="fn" value="${esc(u.Nome)}"></div><div><label>Perfil</label><select id="fp"><option value="FUNCIONARIO" ${u.Perfil === 'FUNCIONARIO' ? 'selected' : ''}>Funcionário</option><option value="PROPRIETARIO" ${u.Perfil === 'PROPRIETARIO' ? 'selected' : ''}>Proprietário</option></select></div>
      <div><label>Comissão (% sobre a mão de obra)</label><input id="fc" inputmode="decimal" value="${esc(u.Comissao)}"></div><div><label>${u.ID ? 'Novo PIN (deixe vazio para manter)' : 'PIN (4 a 8 números)'}</label><input id="fk" inputmode="numeric" autocomplete="off"></div>
      <div><label>Situação</label><select id="fa"><option value="SIM" ${u.Ativo === 'SIM' ? 'selected' : ''}>Ativo</option><option value="NAO" ${u.Ativo === 'NAO' ? 'selected' : ''}>Inativo</option></select></div></div>
      <div style="display:flex;gap:8px;margin-top:16px"><button class="btn" id="fs">Salvar</button><button class="btn sec" id="fx">Cancelar</button></div></div>`;
      document.body.appendChild(m); m.querySelector('#fx').onclick = () => m.remove();
      m.querySelector('#fs').onclick = async () => { try { await api('api_salvarUsuario', PIN, { id: u.ID, nome: m.querySelector('#fn').value, perfil: m.querySelector('#fp').value, comissao: m.querySelector('#fc').value, pin: m.querySelector('#fk').value, ativo: m.querySelector('#fa').value });
        if (u.ID && u.ID === CFG.USUARIO.ID && m.querySelector('#fk').value) { PIN = m.querySelector('#fk').value; store.set('pin', PIN); } toast('Salvo.'); m.remove(); CFG = await api('api_login', PIN); viewFunc(); } catch (e) { toast(e.message, true); } }; };
    $('#nf').onclick = () => form();
    document.querySelectorAll('[data-e]').forEach(b => b.onclick = () => form(us.find(u => u.ID === b.dataset.e)));
    document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { FILTRO = '__tec:' + b.dataset.s; shell('painel'); });
  } catch (e) { toast(e.message, true); }
}
/* ---- Configurações ---- */
function logoPequena(file) { // reduz o logo (PNG com transparência) até caber na célula da planilha
  return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => { const i = new Image(); i.onload = () => {
    for (const w of [420, 340, 280, 220, 180]) { const c = document.createElement('canvas'); c.width = Math.min(w, i.width); c.height = Math.round(i.height * c.width / i.width); c.getContext('2d').drawImage(i, 0, 0, c.width, c.height); const u = c.toDataURL('image/png'); if (u.length < 44000) return ok(u); }
    no(new Error('Imagem muito complexa. Use um PNG simples com fundo transparente.')); }; i.src = r.result; }; r.readAsDataURL(file); });
}
function viewCfg() {
  NEWLOGO = null;
  const f = (k, l, t) => `<div><label>${l}</label><input data-k="${k}" type="${t || 'text'}" value="${esc(CFG[k])}"></div>`;
  $('#m').innerHTML = `<div class="ph"><h1>Configurações</h1></div>
  <div class="card"><h2>Identidade da empresa</h2><div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><img id="lg" src="${logoSrc()}" style="height:70px;width:auto;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff"><div><label>Trocar logo (PNG com fundo transparente)</label><input type="file" id="lf" accept="image/png,image/jpeg"><button class="btn sec sm" id="lr" type="button" style="margin-top:6px">Voltar ao logo original</button></div></div>
  <div class="grid">${f('EMPRESA', 'Nome fantasia')}${f('RAZAO_SOCIAL', 'Razão social')}${f('CNPJ', 'CNPJ ou CPF')}${f('ENDERECO', 'Endereço completo')}${f('CIDADE_UF', 'Cidade / Estado')}${f('CEP', 'CEP')}${f('TELEFONE', 'Telefone')}${f('TELEFONE_EMPRESA', 'WhatsApp da oficina (usado nos disparos)')}${f('EMAIL', 'E-mail')}${f('PIX', 'Chave Pix')}${f('HORARIO', 'Horário de funcionamento / retirada')}${f('DIAS_ABANDONO', 'Dias para abandono (comprovante)')}${f('GARANTIA_DIAS', 'Garantia padrão (dias)')}${f('FRONTEND_URL', 'URL pública do GitHub Pages (links para clientes)')}
  <div class="full"><label>Informações adicionais (saem nos documentos)</label><textarea data-k="INFO_ADICIONAL">${esc(CFG.INFO_ADICIONAL)}</textarea></div></div></div>
  <div class="card"><h2>Pagamentos e comissões</h2><div class="grid"><div class="full"><label>Formas de pagamento aceitas (separe por vírgula; pode incluir outras)</label><input data-k="FORMAS_PAG" value="${esc(CFG.FORMAS_PAG)}"></div>
  <div class="full"><label>Quando a comissão do técnico é gerada</label><select data-k="REGRA_COMISSAO"><option value="CONCLUSAO" ${CFG.REGRA_COMISSAO !== 'PAGAMENTO' ? 'selected' : ''}>Quando o serviço ficar pronto para retirada</option><option value="PAGAMENTO" ${CFG.REGRA_COMISSAO === 'PAGAMENTO' ? 'selected' : ''}>Somente após o pagamento total do cliente</option></select></div></div></div>
  <div class="card"><h2>Envio de WhatsApp</h2><div class="grid"><div class="full"><label>Provedor</label><select data-k="PROVEDOR">${['MANUAL', 'ZAPI', 'EVOLUTION', 'META'].map(o => `<option ${o === CFG.PROVEDOR ? 'selected' : ''}>${o}</option>`).join('')}</select>
  <div class="hint">MANUAL abre o WhatsApp com a mensagem pronta (sem custo). ZAPI / EVOLUTION: envio automático via QR Code. META: API oficial (WhatsApp Cloud).</div></div>
  ${f('API_URL', 'URL da API (Z-API: .../instances/ID/token/TOKEN · Evolution: URL do servidor)')}${f('API_ID', 'ID (Evolution: instância · Meta: Phone Number ID)')}${f('API_TOKEN', 'Token / API key', 'password')}${f('CLIENT_TOKEN', 'Client-Token (Z-API)', 'password')}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="cs">Salvar configurações</button><button class="btn sec" id="bk">Fazer backup agora</button><a class="btn sec" style="text-decoration:none" href="${esc(CFG.PLANILHA)}" target="_blank">Abrir planilha</a></div>
  <p class="hint">O backup também roda sozinho todo dia (cópia da planilha na pasta “Backups” do seu Drive).</p>`;
  $('#lf').onchange = async e => { try { NEWLOGO = await logoPequena(e.target.files[0]); $('#lg').src = NEWLOGO; } catch (er) { toast(er.message, true); } };
  $('#lr').onclick = () => { NEWLOGO = '__REMOVER__'; $('#lg').src = LOGO; };
  $('#bk').onclick = async () => { const b = $('#bk'); b.disabled = true; b.textContent = 'Copiando…'; try { await api('api_backup', PIN); toast('Backup criado no Drive.'); } catch (e) { toast(e.message, true); } b.disabled = false; b.textContent = 'Fazer backup agora'; };
  $('#cs').onclick = async () => { const o = {}; document.querySelectorAll('[data-k]').forEach(i => o[i.dataset.k] = i.value); if (NEWLOGO) o.LOGO_DATA = NEWLOGO;
    try { CFG = await api('api_salvarConfig', PIN, o); toast('Configurações salvas.'); shell('cfg'); } catch (e) { toast(e.message, true); } };
}

/* ---- Início ---- */
if (BOOT.modo === 'cliente') viewCliente();
else if (PIN) api('api_login', PIN).then(c => { CFG = c; shell('dash'); }).catch(viewLogin); else viewLogin();
